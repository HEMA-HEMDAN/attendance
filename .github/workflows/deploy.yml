name: Deploy to AWS VPS

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Create project directory if it doesn't exist
            mkdir -p ~/attendance
            cd ~/attendance
            
            # Pull latest code or clone if it doesn't exist
            if [ -d ".git" ]; then
              git fetch --all
              git reset --hard origin/master
              git pull origin master
            else
              # Initialize and force pull to avoid non-empty directory issues
              git init
              git remote add origin https://github.com/HEMA-HEMDAN/attendance.git
              git fetch
              git checkout -t origin/master -f
            fi
            
            # Create .env.prod file from GitHub Secrets
            cat <<EOF > .env.prod
            SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DEBUG=False
            ALLOWED_HOSTS=horus.social,www.horus.social,${{ secrets.VPS_HOST }}
            
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_PORT=5432
            
            JWT_ACCESS_TOKEN_LIFETIME_MINUTES=60
            JWT_REFRESH_TOKEN_LIFETIME_DAYS=7
            
            CORS_ALLOW_ALL_ORIGINS=False
            CORS_ALLOWED_ORIGINS=https://horus.social,https://www.horus.social
            EOF
            
            # Build and deploy the Docker containers
            export DOCKER_BUILDKIT=0
            docker compose up --build -d
            
            # Clean up dangling images to save space
            docker image prune -f
