
name: Deploy to AWS VPS

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: attendance-production-deployment
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26

      - name: Set lowercase repository owner
        run: |
          echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/attendance_web:latest

  deploy:
    name: Deploy Application
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USERNAME,REPO_OWNER,GITHUB_REPOSITORY,GITHUB_REF_NAME,VPS_HOST,DJANGO_SECRET_KEY,DB_NAME,DB_USER,DB_PASSWORD
          script: |
            set -eu
            umask 077

            mkdir -p ~/attendance
            cd ~/attendance

            # Fetch the public repository without exposing a GitHub token.
            if [ ! -d ".git" ]; then
              git init
              git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            else
              git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
            fi

            git fetch --depth=1 origin "$GITHUB_REF_NAME"
            git checkout -f -B "$GITHUB_REF_NAME" FETCH_HEAD
            git reset --hard FETCH_HEAD

            # Generate production environment file.
            cat > .env.prod <<EOF
            SECRET_KEY=${DJANGO_SECRET_KEY}
            DEBUG=False
            ALLOWED_HOSTS=horus.social,www.horus.social,${VPS_HOST},fci.elmanasah.app

            DB_NAME=${DB_NAME}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            DB_PORT=5432

            JWT_ACCESS_TOKEN_LIFETIME_MINUTES=60
            JWT_REFRESH_TOKEN_LIFETIME_DAYS=7

            CORS_ALLOW_ALL_ORIGINS=False
            CORS_ALLOWED_ORIGINS=https://horus.social,https://www.horus.social,https://fci.elmanasah.app
            EOF

            # Authenticate to GHCR and pull the new image.
            REPO_OWNER_LOWER=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')

            printf '%s' "$GHCR_TOKEN" |
              docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            docker compose -f docker-compose.prod.yml pull

            # Remove the temporary registry authentication.
            docker logout ghcr.io

            # Start the application using the pulled image.
            docker compose -f docker-compose.prod.yml up -d --pull never

            echo "Waiting for attendance_web container..."
            sleep 10

            # Apply database migrations.
            docker exec attendance_web python manage.py migrate --noinput

            # Clean unused images.
            docker image prune -f

            echo "Deployment completed successfully."
