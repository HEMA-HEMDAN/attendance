name: Deploy to AWS VPS

on:
  push:
    branches:
      - master
      - main

# Grant GITHUB_TOKEN permissions to push to GitHub Container Registry
permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set lowercase repository owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/attendance_web:latest

  deploy:
    name: Deploy Application
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Create project directory if it doesn't exist
            mkdir -p ~/attendance
            cd ~/attendance
            
            # Always initialize and update remote to guarantee authentication works
            if [ ! -d ".git" ]; then
              git init
            fi
            
            # Remove old remote if it exists and add the authenticated one
            git remote remove origin || true
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            
            # Fetch and reset
            git fetch --all
            git checkout ${{ github.ref_name }} || git checkout -b ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            
            # Create .env.prod file from GitHub Secrets
            cat <<EOF > .env.prod
            SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DEBUG=False
            ALLOWED_HOSTS=horus.social,www.horus.social,${{ secrets.VPS_HOST }}
            
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_PORT=5432
            
            JWT_ACCESS_TOKEN_LIFETIME_MINUTES=60
            JWT_REFRESH_TOKEN_LIFETIME_DAYS=7
            
            CORS_ALLOW_ALL_ORIGINS=False
            CORS_ALLOWED_ORIGINS=https://horus.social,https://www.horus.social
            EOF
            
            # Pull the pre-built image and deploy
            export REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T web python manage.py migrate --noinput
            
            # Clean up dangling images to save space
            docker image prune -f
