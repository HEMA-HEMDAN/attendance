name: Deploy to AWS VPS

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest

    outputs:
      repo_owner: ${{ steps.meta.outputs.repo_owner }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Owner
        id: meta
        shell: bash
        run: |
          echo "repo_owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.repo_owner }}/attendance_web:latest

  deploy:
    name: Deploy Application
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          REPO_OWNER: ${{ needs.build-and-push.outputs.repo_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          VPS_HOST_VALUE: ${{ secrets.VPS_HOST }}

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: REPO_OWNER,GITHUB_REPOSITORY,GITHUB_REF_NAME,DJANGO_SECRET_KEY,DB_NAME,DB_USER,DB_PASSWORD,VPS_HOST_VALUE

          script: |
            set -euo pipefail

            echo "Deploying ${GITHUB_REPOSITORY} (${GITHUB_REF_NAME})"
            echo "Docker owner: ${REPO_OWNER}"

            mkdir -p ~/attendance
            cd ~/attendance

            # Fetch public source repository.
            if [ ! -d ".git" ]; then
              git clone \
                --branch "$GITHUB_REF_NAME" \
                --depth 1 \
                "https://github.com/${GITHUB_REPOSITORY}.git" .
            else
              git remote set-url origin \
                "https://github.com/${GITHUB_REPOSITORY}.git"

              git fetch origin "$GITHUB_REF_NAME"
              git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
              git reset --hard "origin/$GITHUB_REF_NAME"
            fi

            # Secure production environment.
            umask 077

            cat > .env.prod <<EOF
            REPO_OWNER=${REPO_OWNER}
            SECRET_KEY=${DJANGO_SECRET_KEY}
            DEBUG=False
            ALLOWED_HOSTS=horus.social,www.horus.social,${VPS_HOST_VALUE},fci.elmanasah.app

            DB_NAME=${DB_NAME}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            DB_PORT=5432

            JWT_ACCESS_TOKEN_LIFETIME_MINUTES=60
            JWT_REFRESH_TOKEN_LIFETIME_DAYS=7

            CORS_ALLOW_ALL_ORIGINS=False
            CORS_ALLOWED_ORIGINS=https://horus.social,https://www.horus.social,https://fci.elmanasah.app
            EOF

            # Remove stale registry credentials.
            docker logout ghcr.io || true

            # Pull public images anonymously.
            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml pull

            # Start application.
            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml up -d

            echo "Waiting for application..."
            sleep 10

            # Apply database migrations.
            docker exec attendance_web \
              python manage.py migrate --noinput

            # Verify running containers.
            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml ps

            # Clean unused images.
            docker image prune -f

            echo "Deployment completed successfully."
