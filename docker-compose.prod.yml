version: "3.8"

services:

  redis:
    image: redis:7-alpine
    container_name: attendance_redis
    restart: always
    command: redis-server --appendonly yes --notify-keyspace-events Ex
    volumes:
      - redis_prod_data:/data
    networks:
      - attendance_net

  web:
    image: ghcr.io/${REPO_OWNER}/attendance_web:latest
    container_name: attendance_web
    restart: always
    env_file:
      - .env.prod
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_URL=redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - redis
    networks:
      - attendance_net

  session_worker:
    image: ghcr.io/${REPO_OWNER}/attendance_web:latest
    container_name: attendance_session_worker
    restart: always
    command: python manage.py listen_session_expirations
    env_file:
      - .env.prod
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_URL=redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - web
    networks:
      - attendance_net

  nginx:
    image: nginx:alpine
    container_name: attendance_nginx
    restart: always
    ports:
      - "80:80"
      # Add this only when Nginx is configured for HTTPS:
      # - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - attendance_net

volumes:
  static_volume:
  media_volume:
  redis_prod_data:

networks:
  attendance_net:
    driver: bridge

