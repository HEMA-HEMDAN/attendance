version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance_web
    restart: always
    env_file:
      - .env.prod
    environment:
      # Connect to the VPS host databases natively
      - DB_HOST=host.docker.internal
      - REDIS_URL=redis://host.docker.internal:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - static_volume:/server/staticfiles
      - media_volume:/server/media
    depends_on:
      - nginx

  nginx:
    image: nginx:alpine
    container_name: attendance_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/server/staticfiles:ro
      - media_volume:/server/media:ro

volumes:
  static_volume:
  media_volume:
