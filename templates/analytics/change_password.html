<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password — Academic Staff</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success: #10b981;
            --success-light: #ecfdf5;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --radius-card: 20px;
            --radius-btn: 12px;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 20px;
            color: #ffffff;
        }

        .brand-title {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-card);
            transition: all 0.2s;
        }

        .nav-link:hover {
            color: var(--primary);
            border-color: var(--primary-light);
            background: var(--primary-light);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: 36px;
            width: 100%;
            max-width: 460px;
            box-shadow: var(--shadow-md);
        }

        .card-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .card-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .alert-danger {
            background-color: var(--danger-light);
            color: var(--danger);
            border: 1px solid #fca5a5;
        }

        .alert-success {
            background-color: var(--success-light);
            color: var(--success);
            border: 1px solid #6ee7b7;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--bg-input);
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary);
            background-color: #ffffff;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-btn);
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }

        .submit-btn:hover {
            opacity: 0.92;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-brand">
            <div class="brand-logo">U</div>
            <div class="brand-title">UniAttend Staff Portal</div>
        </div>
        <div class="user-info">
            <a class="nav-link" href="{% url 'analytics-dashboard-web' %}">Dashboard</a>
            <a class="nav-link" href="{% url 'web-logout' %}">Logout</a>
        </div>
    </header>

    <main>
        <div class="card">
            <h1 class="card-title">Change Password</h1>
            <p class="card-subtitle">Update your password securely for your academic account.</p>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            {% if success %}
                <div class="alert alert-success">{{ success }}</div>
            {% endif %}

            <form method="POST" action="{% url 'staff-change-password-web' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label" for="old_password">Current Password</label>
                    <input type="password" id="old_password" name="old_password" class="form-input" required autofocus autocomplete="current-password">
                </div>

                <div class="form-group">
                    <label class="form-label" for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password" class="form-input" required minlength="8" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-input" required minlength="8" autocomplete="new-password">
                </div>

                <button type="submit" class="submit-btn">Update Password</button>
            </form>

            <a href="{% url 'analytics-dashboard-web' %}" class="back-link">← Back to Dashboard</a>
        </div>
    </main>
</body>
</html>
